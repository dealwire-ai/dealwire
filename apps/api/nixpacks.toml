[phases.setup]
nixPkgs = ["nodejs-22_x", "poppler", "binutils"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.25.0 --activate",
  "which pdftotext || echo 'WARNING: pdftotext not found'",
  "which strings || echo 'WARNING: strings not found'",
  "pnpm install --frozen-lockfile --filter @analyzer/api..."
]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "node dist/src/main.js"

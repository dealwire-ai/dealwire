version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - chore
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-safe:
        patterns: ["*"]
        update-types:
          - minor
          - patch
      npm-majors:
        patterns: ["*"]
        update-types:
          - major
    ignore:
      # Major bumps for these tend to need manual coordination — review separately.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    labels:
      - chore
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-all:
        patterns: ["*"]
        update-types:
          - minor
          - patch
          - major

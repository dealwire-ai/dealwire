name: DB Backup

on:
  schedule:
    - cron: "0 3 * * *" # 3am UTC nightly
  workflow_dispatch: # allow manual trigger

jobs:
  backup:
    name: Dump and store
    runs-on: ubuntu-latest

    steps:
      - name: Install postgres client
        run: |
          sudo apt-get install -y gnupg curl
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          FILENAME="backup-${TIMESTAMP}.sql"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner \
            --no-acl \
            --format=plain \
            --file="${FILENAME}"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Push to backup repo
        env:
          BACKUP_REPO_PAT: ${{ secrets.BACKUP_REPO_PAT }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git clone "https://x-access-token:${BACKUP_REPO_PAT}@github.com/isaac-levine/dealwire-db-backups.git" backup-repo
          mv "$FILENAME" backup-repo/
          cd backup-repo
          git add "$FILENAME"
          git commit -m "$FILENAME"
          git push
